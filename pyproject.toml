[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replay8004"
version = "0.1.0"
description = "Re-execution validator for the ERC-8004 Validation Registry on Celo: checks on-chain claims made by AI agents and answers with hash-chained evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["eth-abi>=5,<7", "eth-account>=0.11,<0.15", "eth-hash[pycryptodome]>=0.7"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
replay8004 = "replay8004.cli:main"

[tool.setuptools]
packages = ["replay8004", "replay8004.checkers"]
