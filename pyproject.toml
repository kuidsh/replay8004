[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replay8004"
version = "0.5.0"
description = "Re-execution validator for the ERC-8004 Validation Registry on Celo: checks on-chain claims made by AI agents and answers with hash-chained evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["eth-abi>=5,<7", "eth-account>=0.11,<0.15", "eth-hash[pycryptodome]>=0.7"]
keywords = ["erc-8004", "celo", "ai-agents", "validation", "x402", "evm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://kuidsh.github.io/replay8004/"
Repository = "https://github.com/kuidsh/replay8004"
Issues = "https://github.com/kuidsh/replay8004/issues"
Status = "https://replay8004-mainnet-evidencebucket-exgfx3xqkhfr.s3.us-east-1.amazonaws.com/evidence/status/index.html"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]
contracts = ["web3>=7,<8", "eth-tester>=0.12.0b1,<0.14.0b1", "py-evm>=0.12.0b2,<0.13.0b1"]  # betas only; no pysha3 (no Windows wheel)
mcp = ["mcp>=1.2,<2"]

[project.scripts]
replay8004 = "replay8004.cli:main"
replay8004-mcp = "replay8004.mcp_server:main"

[tool.setuptools]
packages = ["replay8004", "replay8004.checkers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
