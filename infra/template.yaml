AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: replay8004 - ERC-8004 re-execution validator for Celo (NOT DEPLOYED; operator deploys in their own account)

Parameters:
  Network:
    Type: String
    Default: celo-sepolia
    AllowedValues: [celo-sepolia, celo-mainnet]
  AllowMainnet:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Must be 1 for celo-mainnet. Set only after testing on Sepolia.
  DryRun:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: 1 = compute answers and evidence but send no transactions.
  ValidatorAddress:
    Type: String
    Description: Address of the validator key (used in dry-run mode).
  ValidatorKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager secret holding ONLY the validator's private key (needed when DryRun=0).
  StartBlock:
    Type: Number
    Default: 0
    Description: First block to scan on empty state. 0 means the ValidationRegistry's deployment block.
  EvidenceRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days each evidence file stays locked (S3 Object Lock COMPLIANCE, which nobody can shorten or remove). Use 1 for test stacks.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Managed policy set as the permissions boundary of every IAM role this stack creates (infra/iam/).

Conditions:
  HasKey: !Not [!Equals [!Ref ValidatorKeySecretArn, ""]]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  # Kept when the stack is deleted: its files are locked (and on-chain answers link to them). Delete it by hand
  # once the last lock expires; see docs/AWS-TEARDOWN.md.
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]
      ObjectLockEnabled: true
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}

  EvidencePublicRead:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadEvidenceOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # Created before the function, with a fixed name: otherwise the first scheduled run can create
  # /aws/lambda/<function> itself and this resource then fails with "already exists".
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-worker"
      RetentionInDays: 30
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-worker"
      LoggingConfig: {LogGroup: !Ref WorkerLogs}
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: ../build/lambda
      Tags: {Project: replay8004, Stack: !Ref AWS::StackName}
      Handler: replay8004.lambda_handler.handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 50
      Environment:
        Variables:
          NETWORK: !Ref Network
          REPLAY8004_ALLOW_MAINNET: !Ref AllowMainnet
          DRY_RUN: !Ref DryRun
          VALIDATOR_ADDRESS: !Ref ValidatorAddress
          VALIDATOR_KEY_SECRET_ARN: !Ref ValidatorKeySecretArn
          STATE_TABLE: !Ref StateTable
          START_BLOCK: !Ref StartBlock
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          EVIDENCE_BASE_URL: !Sub "https://${EvidenceBucket}.s3.${AWS::Region}.amazonaws.com"
          EVIDENCE_RETENTION_DAYS: !Ref EvidenceRetentionDays
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref StateTable}
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:PutObjectRetention]
              Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"
        - !If
          - HasKey
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ValidatorKeySecretArn
          - !Ref AWS::NoValue
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-every-minute"
            ScheduleExpression: rate(1 minute)
            RetryPolicy: {MaximumRetryAttempts: 0}   # the default retries a failed run 185 times; the next minute retries anyway
            PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]

Outputs:  # every name needed to take the project down (docs/AWS-TEARDOWN.md)
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  WorkerLogGroupName:
    Value: !Ref WorkerLogs
  ScheduleName:
    Value: !Sub "${AWS::StackName}-every-minute"
  WorkerRoleName:
    Value: !Ref WorkerFunctionRole
  SchedulerRoleName:
    Value: !Ref WorkerFunctionEveryMinuteRole
  EvidenceBaseUrl:
    Value: !Sub "https://${EvidenceBucket}.s3.${AWS::Region}.amazonaws.com/evidence"
  StateTableName:
    Value: !Ref StateTable
