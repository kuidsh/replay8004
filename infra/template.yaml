AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: replay8004 - ERC-8004 re-execution validator for Celo (NOT DEPLOYED; operator deploys in their own account)

Parameters:
  Network:
    Type: String
    Default: celo-sepolia
    AllowedValues: [celo-sepolia, celo-mainnet]
  AllowMainnet:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Must be 1 for celo-mainnet. Set only after testing on Sepolia.
  DryRun:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: 1 = compute answers and evidence but send no transactions.
  ValidatorAddress:
    Type: String
    Description: Address of the validator key (used in dry-run mode).
  ValidatorKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager secret holding ONLY the validator's private key (needed when DryRun=0).
  StartBlock:
    Type: Number
    Default: 0
    Description: First block to scan on empty state. 0 means the ValidationRegistry's deployment block.
  EvidenceRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days each evidence file stays locked (S3 Object Lock COMPLIANCE, which nobody can shorten or remove). Use 1 for test stacks.
  MaxAnswersPerDay:
    Type: Number
    Default: 20
    MinValue: 0
    Description: Gas guard. At most this many answers per UTC day (about 0.027 CELO each); later requests wait. 0 pauses answering.
  MaxAnswersPerAgentPerDay:
    Type: Number
    Default: 5
    MinValue: 0
    Description: Gas guard. At most this many answers per agent per UTC day, so one agent cannot use up the daily cap.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Managed policy set as the permissions boundary of every IAM role this stack creates (infra/iam/).
  # -- paid mode (v0.5, docs/PAID.md). Off by default: with PaidMode=0 none of the paywall resources exist. --
  PaidMode:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: 1 = answer only requests covered by the free quota, the allowlist or x402 credits (Sepolia only for now).
  PayTo:
    Type: String
    Default: ""
    Description: Operator address that receives USDC for credit packs (no key needed here). Not the validator wallet.
  FacilitatorKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager secret holding the Celo x402 facilitator API key (needed for /settle).
  FreePerMonth:
    Type: Number
    Default: 25
    MinValue: 0
    Description: Free answers per agent per calendar month in paid mode.
  FreeAccounts:
    Type: String
    Default: ""
    Description: Comma-separated "<chainId>:<agentId>" accounts that never pay (open-source agents).

Rules:
  PaidModeNotOnMainnetYet:  # paid mode is untested end to end; mainnet stays free until a Sepolia purchase works
    RuleCondition: !Equals [!Ref Network, celo-mainnet]
    Assertions:
      - Assert: !Equals [!Ref PaidMode, "0"]
        AssertDescription: PaidMode=1 is refused on celo-mainnet (run it on Sepolia first; see docs/PAID.md).

Conditions:
  HasKey: !Not [!Equals [!Ref ValidatorKeySecretArn, ""]]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  Paid: !Equals [!Ref PaidMode, "1"]
  HasFacilitatorKey: !And [!Condition Paid, !Not [!Equals [!Ref FacilitatorKeySecretArn, ""]]]

Resources:
  # Kept when the stack is deleted: its files are locked (and on-chain answers link to them). Delete it by hand
  # once the last lock expires; see docs/AWS-TEARDOWN.md.
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]
      ObjectLockEnabled: true
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}

  EvidencePublicRead:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadEvidenceOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # Created before the function, with a fixed name: otherwise the first scheduled run can create
  # /aws/lambda/<function> itself and this resource then fails with "already exists".
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-worker"
      RetentionInDays: 30
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-worker"
      LoggingConfig: {LogGroup: !Ref WorkerLogs}
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: ../build/lambda
      Tags: {Project: replay8004, Stack: !Ref AWS::StackName}
      Handler: replay8004.lambda_handler.handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 50
      Environment:
        Variables:
          NETWORK: !Ref Network
          REPLAY8004_ALLOW_MAINNET: !Ref AllowMainnet
          DRY_RUN: !Ref DryRun
          VALIDATOR_ADDRESS: !Ref ValidatorAddress
          VALIDATOR_KEY_SECRET_ARN: !Ref ValidatorKeySecretArn
          STATE_TABLE: !Ref StateTable
          START_BLOCK: !Ref StartBlock
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          EVIDENCE_BASE_URL: !Sub "https://${EvidenceBucket}.s3.${AWS::Region}.amazonaws.com"
          EVIDENCE_RETENTION_DAYS: !Ref EvidenceRetentionDays
          MAX_ANSWERS_PER_DAY: !Ref MaxAnswersPerDay
          MAX_ANSWERS_PER_AGENT_PER_DAY: !Ref MaxAnswersPerAgentPerDay
          PAID_MODE: !Ref PaidMode
          FREE_PER_MONTH: !Ref FreePerMonth
          FREE_ACCOUNTS: !Ref FreeAccounts
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref StateTable}
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:PutObjectRetention]
              Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"
        - !If
          - HasKey
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ValidatorKeySecretArn
          - !Ref AWS::NoValue
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-every-minute"
            ScheduleExpression: rate(1 minute)
            RetryPolicy: {MaximumRetryAttempts: 0}   # the default retries a failed run 185 times; the next minute retries anyway
            PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]

  # x402 credit-pack paywall: only with PaidMode=1. Same conventions as the worker: fixed name, log group first,
  # boundary, tags, no reserved concurrency (this account's quota can't spare it; see tests/test_packaging.py).
  PaywallLogs:
    Type: AWS::Logs::LogGroup
    Condition: Paid
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-paywall"
      RetentionInDays: 30
      Tags: [{Key: Project, Value: replay8004}, {Key: Stack, Value: !Ref AWS::StackName}]

  PaywallFunction:
    Type: AWS::Serverless::Function
    Condition: Paid
    Properties:
      FunctionName: !Sub "${AWS::StackName}-paywall"
      LoggingConfig: {LogGroup: !Ref PaywallLogs}
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: ../build/lambda
      Tags: {Project: replay8004, Stack: !Ref AWS::StackName}
      Handler: replay8004.lambda_handler.paywall_handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      FunctionUrlConfig:
        AuthType: NONE   # x402 is the authentication; the function holds no key that can move funds
      Environment:
        Variables:
          NETWORK: !Ref Network
          REPLAY8004_ALLOW_MAINNET: !Ref AllowMainnet
          STATE_TABLE: !Ref StateTable
          PAY_TO: !Ref PayTo
          PAID_MODE: !Ref PaidMode
          FREE_PER_MONTH: !Ref FreePerMonth
          FREE_ACCOUNTS: !Ref FreeAccounts
          FACILITATOR_KEY_SECRET_ARN: !Ref FacilitatorKeySecretArn
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref StateTable}
        - !If
          - HasFacilitatorKey
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref FacilitatorKeySecretArn
          - !Ref AWS::NoValue

Outputs:  # every name needed to take the project down (docs/AWS-TEARDOWN.md)
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  WorkerLogGroupName:
    Value: !Ref WorkerLogs
  ScheduleName:
    Value: !Sub "${AWS::StackName}-every-minute"
  WorkerRoleName:
    Value: !Ref WorkerFunctionRole
  SchedulerRoleName:
    Value: !Ref WorkerFunctionEveryMinuteRole
  EvidenceBaseUrl:
    Value: !Sub "https://${EvidenceBucket}.s3.${AWS::Region}.amazonaws.com/evidence"
  StateTableName:
    Value: !Ref StateTable
  PaywallUrl:
    Condition: Paid
    Value: !GetAtt PaywallFunctionUrl.FunctionUrl
  PaywallFunctionName:
    Condition: Paid
    Value: !Ref PaywallFunction
